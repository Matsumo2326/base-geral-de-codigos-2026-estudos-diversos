<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>

    <style>
        div {
            background-color: lightgray;
            border: 1px solid black;
            text-align: center;
            height: 200px;
            width: 200px;
            display: inline-block;
        }

        div > p {
            display: none;
        }
        
        div:hover > p {
            display: block;
        }
        
        div:hover {
            background-color: yellow;
        }


    </style>
</head>
<body>

    <!--
        seletor:pseudo-classe {
        propriedade: valor;
        }

    
    -->

    <div id="d1"> <h2>kkkkkk, teste</h2> <p>01</p> </div>
    <div id="d2"> <p>02</p> </div>
    <div id="d3"> <p>03</p> </div>
</body>
</html>
