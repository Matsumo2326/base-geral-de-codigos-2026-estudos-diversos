<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            text-decoration: underline;
        }

        a:active {
            color: yellow;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="https://github.com/Matheus934" target="_blank"><p>Github</p></a></li>
        <li><a href="https://www.instagram.com/_mattzim/" target="_blank"><p>Instagram</p></a></li>
        <li><a href="https://www.youtube.com/@Matsuzimkkkj" target="_blank"><p>Youtube</p></a></li>
    </ul>
</body>
</html>
