<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body onload="setFocus()">
    <h1>Calculadora</h1>

    <form name="calc" action="" method="post">

        <input type="text" name="valor1" value="" size="12"><br>
        <input type="text" name="valor2" value="" size="12"><br>

        <input type="button" name="" value="+" onclick="calculadora('+')">
        <input type="button" name="" value="-" onclick="calculadora('-')">
        <input type="button" name="" value="*" onclick="calculadora('*')">
        <input type="button" name="" value="/" onclick="calculadora('/')=-="> <br>

        <input type="text" name="resultado" value="" size="12">
    </form>
<script src="./app.js"></script>
</body>
</html>
