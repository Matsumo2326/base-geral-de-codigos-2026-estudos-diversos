<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body bgcolor="#add8ef">
    <center>
        <h1>Tabelas</h1>

        <table border="1" width="70%" bgcolor="#ff0" cellspacing="10px">
            <caption style="font-family: 'Courier New', Courier, monospace; font-size: 150%;">
                Notas dos alunos
            </caption>
            <tbody>
            <tr bgcolor="#A550">
                <th>Aluno</th>
                <th>Nota 1</th>
                <th>Nota 2</th>
                <th>Nota 3</th>
            </tr>
            <tr>
                <td>Junior</td>
                <td>6,7</td>
                <td>8,0</td>
                <td>7,4</td>
            </tr>
            <tr>
                <td>Emily</td>
                <td>9,7</td>
                <td>7,0</td>
                <td>8,7</td>
            </tr>
            <tr>
                <td>Sara</td>
                <td>4,0</td>
                <td>3,8</td>
                <td>5,9</td>
            </tr>
            </tbody>
            <tfoot>
            <tr bgcolor="#00f">
                <td colspan="4"> <marquee behavior="scroll" direction="left"><font color="#ffffff">Sistema integrado de Notas</font></marquee></td>
            </tr>
            </tfoot>
        </table>
    </center>
</body>
</html>
